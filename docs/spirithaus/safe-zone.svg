<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" role="img" aria-labelledby="t d">
  <title id="t">Where the subject goes in a SPIRITHAUS hero master</title>
  <desc id="d">A square master divided into four horizontal bands: the top 29 percent and bottom 29 percent are cropped away on wide screens, the band from 29 to 50 percent is safe for the subject, and below 50 percent the headline sits.</desc>
  <rect width="900" height="660" fill="#111110"/>

  <text x="40" y="44" fill="#F2EFE9" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="21" font-weight="600">Where the subject goes</text>
  <text x="40" y="68" fill="#8C877C" font-family="Archivo, Helvetica, Arial, sans-serif" font-size="13">Square master, 1:1. Percentages are of the master&#8217;s height.</text>

  <!-- master square: x 40..560, y 96..616 (520px = 100%) -->
  <rect x="40" y="96" width="520" height="520" fill="#0B0B0A" stroke="#26251F"/>

  <!-- bands -->
  <rect x="40" y="96"  width="520" height="148.7" fill="#CF1C29" fill-opacity="0.22"/>
  <rect x="40" y="244.7" width="520" height="111.3" fill="#7A8F6B" fill-opacity="0.30"/>
  <rect x="40" y="356"   width="520" height="115.3" fill="#C98A2E" fill-opacity="0.24"/>
  <rect x="40" y="471.3" width="520" height="144.7" fill="#CF1C29" fill-opacity="0.22"/>

  <!-- horizontal rules -->
  <g stroke="#F2EFE9" stroke-opacity="0.5" stroke-dasharray="4 4">
    <line x1="40" y1="244.7" x2="560" y2="244.7"/>
    <line x1="40" y1="356"   x2="560" y2="356"/>
    <line x1="40" y1="471.3" x2="560" y2="471.3"/>
  </g>

  <!-- side crop limits: x 0.127 and 0.873 -->
  <g stroke="#F2EFE9" stroke-opacity="0.35" stroke-dasharray="2 5">
    <line x1="106" y1="96" x2="106" y2="616"/>
    <line x1="494" y1="96" x2="494" y2="616"/>
  </g>
  <text x="112" y="610" fill="#8C877C" font-family="IBM Plex Mono, monospace" font-size="10">side crop limit, x 0.127 &#8211; 0.873</text>

  <!-- the subject, sitting where it should -->
  <rect x="40" y="267.6" width="520" height="36.4" fill="#7A8F6B" fill-opacity="0.45"/>
  <text x="48" y="262" fill="#7A8F6B" font-family="Space Mono, IBM Plex Mono, monospace" font-size="10">AIM HERE  0.33 – 0.40</text>
  <circle cx="300" cy="285" r="46" fill="#C88A30" fill-opacity="0.55" stroke="#F2EFE9" stroke-opacity="0.85" stroke-width="2"/>
  <g stroke="#F2EFE9" stroke-opacity="0.9" stroke-width="2">
    <line x1="288" y1="285" x2="312" y2="285"/><line x1="300" y1="273" x2="300" y2="297"/>
  </g>
  <text x="124" y="291" fill="#F2EFE9" font-family="IBM Plex Mono, monospace" font-size="11">subject sits here</text>

  <!-- band labels -->
  <g font-family="Archivo, Helvetica, Arial, sans-serif">
    <text x="592" y="160" fill="#CF1C29" font-size="15" font-weight="600">CROPPED</text>
    <text x="592" y="182" fill="#F2EFE9" font-size="13">0.00 &#8211; 0.29</text>
    <text x="592" y="202" fill="#8C877C" font-size="12">Gone on a wide desktop. The 2.34:1</text>
    <text x="592" y="219" fill="#8C877C" font-size="12">crop keeps only a centred band.</text>

    <text x="592" y="288" fill="#7A8F6B" font-size="15" font-weight="600">SAFE &#8212; AIM AT 0.33 &#8211; 0.40</text>
    <text x="592" y="310" fill="#F2EFE9" font-size="13">0.29 &#8211; 0.50</text>
    <text x="592" y="330" fill="#8C877C" font-size="12">On screen at every viewport, and</text>
    <text x="592" y="347" fill="#8C877C" font-size="12">above where the headline sits.</text>

    <text x="592" y="400" fill="#C98A2E" font-size="15" font-weight="600">TEXT SITS HERE</text>
    <text x="592" y="422" fill="#F2EFE9" font-size="13">0.50 +</text>
    <text x="592" y="442" fill="#8C877C" font-size="12">Visible, but the type stack lands</text>
    <text x="592" y="459" fill="#8C877C" font-size="12">on it. Keep it quiet and empty.</text>

    <text x="592" y="520" fill="#CF1C29" font-size="15" font-weight="600">CROPPED</text>
    <text x="592" y="542" fill="#F2EFE9" font-size="13">0.71 &#8211; 1.00</text>
    <text x="592" y="562" fill="#8C877C" font-size="12">Also discarded on a wide desktop.</text>
  </g>

  <text x="40" y="648" fill="#8C877C" font-family="IBM Plex Mono, monospace" font-size="10">Derived from the live theme: hero renders 0.75:1 to 2.34:1, so only the middle 43% of the height survives every viewport.</text>
</svg>
