# Tracked search terms for the geo-grid rank scanner.
# Branded and generic are scored separately and never averaged together:
# branded rank tells you whether the site is indexing and the GBP owns its own
# name; generic rank tells you whether the content engine is working.

generic:
  - "bottle shop near me"
  - "bottle shop marsfield"
  - "liquor store marsfield"
  - "bottle shop macquarie park"
  - "bottle shop macquarie university"
  - "liquor store north ryde"
  - "bottle shop eastwood"
  - "bottle shop epping"
  - "beer near me"
  - "cold beer near me"
  - "wine shop marsfield"
  - "spirits near me"
  - "bottle shop open now"
  - "bottle shop open late"
  - "ice near me"
  - "champagne near me"
  - "craft beer marsfield"
  - "non alcoholic beer near me"
  - "gift wine near me"
  - "liquor delivery marsfield"

branded:
  - "local liquor marsfield"
  - "local liquor marsfield specials"

# Content generators draw the local-intent phrase for a post from here. Each must
# appear verbatim in the first 90 characters of the post body.
#
#   article  what reads correctly in front of it ("" when none is needed), so
#            copy says "Looking for a bottle shop in Marsfield?" and
#            "Looking for cold beer in Marsfield?" rather than one grammar for both.
#   kind     place  = the shop itself ("a bottle shop near Eastwood")
#            product = something you drink ("craft beer in Marsfield")
#            A theme that says "to go with dinner" only makes sense with a
#            product phrase; themes declare which kinds they accept.
content_phrases:
  - {text: "bottle shop in Marsfield", article: "a", kind: "place"}
  - {text: "bottle shop near Macquarie University", article: "a", kind: "place"}
  - {text: "liquor store in Marsfield", article: "a", kind: "place"}
  - {text: "bottle shop near North Ryde", article: "a", kind: "place"}
  - {text: "bottle shop near Eastwood", article: "a", kind: "place"}
  - {text: "wine shop near Macquarie Park", article: "a", kind: "place"}
  - {text: "cold beer in Marsfield", article: "", kind: "product"}
  - {text: "craft beer in Marsfield", article: "", kind: "product"}
  - {text: "spirits in Marsfield", article: "", kind: "product"}
  - {text: "wine in Marsfield", article: "", kind: "product"}
  - {text: "non-alcoholic drinks in Marsfield", article: "", kind: "product"}
  - {text: "zero-alcohol beer in Marsfield", article: "", kind: "product"}

grid:
  size: 7               # odd only: 7, 9 or 11
  spacing_km: 0.6       # 7 x 7 at 0.6 km spans ~3.6 km corner to corner
