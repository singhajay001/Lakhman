# Single source of truth for Local Liquor Marsfield.
# Nothing in src/ may hardcode NAP, URLs, licence details or hours - it all comes from here.
# Fields marked "TODO" must be filled before the relevant phase can run live.

identity:
  trading_name: "Local Liquor Marsfield"
  short_name: "Local Liquor"
  positioning: >-
    Independent local bottle shop. Range depth, staff who know the products,
    no queue, cold stock, fast in-and-out. We do not compete on price with the
    big chains and copy must never imply that we do.
  instagram_handle: "@localliquormarsfield"

address:
  line1: "Shop 5A, 1 Trafalgar Place"
  suburb: "Marsfield"
  state: "NSW"
  postcode: "2122"
  country_code: "AU"
  # Exactly as it must appear on the site, on the GBP and in every citation.
  formatted: "Shop 5A, 1 Trafalgar Place, Marsfield NSW 2122"

contact:
  phone_display: "0452 480 487"
  phone_e164: "+61452480487"

geo:
  # Grid centre for `rank scan`. Operator-supplied, cross-checked against the
  # plus code below: the two agree in longitude exactly and sit 20 m apart in
  # latitude (one 14 m plus-code cell), i.e. the same building. The schema
  # rejects any pairing more than geo_plus_code_tolerance_m apart, so a
  # transposed or mistyped coordinate cannot ship.
  lat: -33.76776563906253
  lng: 151.10798431534218
  # Full Open Location Code. Google displays the short form "64J5+R5 Marsfield".
  plus_code: "4RRH64J5+R5"
  source: "operator-supplied 2026-09-02 (lat/lng + plus code 64J5+R5 Marsfield)"
  verified: true

website:
  canonical_url: "https://localliquormarsfield.com.au/"
  host: "localliquormarsfield.com.au"
  # Hosts a generated link is allowed to use. Keep the canonical host first.
  allowed_hosts:
    - "localliquormarsfield.com.au"
  # Re-crawled from sitemap.xml before every content run (`audit site --refresh-paths`).
  # A CTA pointing at anything not in this list is a build failure.
  site_paths:
    - "/"
    - "/specials"
    - "/spirits"
    - "/full-range"
    - "/services"
    - "/visit-us"
    - "/about"
    - "/contact"
  site_paths_source: "seeded-manually"
  site_paths_crawled_at: null

google:
  # TODO(operator): a ChIJ... string. The dashboard does not show it - use the
  # Place ID Finder, then verify with
  # https://www.google.com/maps/place/?q=place_id:<id>
  # See README "Finding the place_id". Blocks Part B only.
  place_id: null
  # The single biggest map-pack lever. Operator reports it as "Liquor", which is
  # a liquor category and therefore correct in kind - the win is already banked.
  # Google's picker label is "Liquor store"; set primary_category_verified: true
  # once you have read the exact string back off the dashboard.
  primary_category: "Liquor store"
  primary_category_as_reported: "Liquor"
  primary_category_verified: false
  secondary_categories: []
  # Categories that keep the profile in the liquor pack.
  acceptable_primary_categories:
    - "Liquor store"
    - "Wine store"
    - "Beer store"
    - "Alcoholic beverage wholesaler"
  # Categories that would quietly drop the profile out of "bottle shop near me"
  # results. If the primary ever lands here, fix it before anything else.
  flagged_primary_categories:
    - "Supermarket"
    - "Grocery store"
    - "Convenience store"
    - "Corner store"
    - "Store"
    - "Food store"
    - "Discount store"
  # Secondaries worth adding, in priority order. Verify each one exists in the
  # dashboard picker before adding it - Google's list changes without notice,
  # and a category you cannot select is not a category.
  candidate_secondary_categories:
    - "Wine store"
    - "Beer store"
    - "Cold drinks shop"
    - "Beverage distributor"
  # TODO(operator): has Google approved localPosts write access for this project yet?
  # One of: unknown | requested | granted | denied. Keeps PUBLISH_MODE honest.
  api_write_access: "unknown"
  location_resource_name: null   # accounts/{account}/locations/{location}

licence:
  # NSW packaged liquor licence.
  number: "LIQP700301260"
  type: "Packaged liquor licence"
  # The name on the licence record, not the trading name. NSW liquor advertising
  # carries the licensee name plus the licence number.
  licensee_name: "Ajaypaul Singh"
  licensee_name_verified: true

hours:
  # What customers see. Advertise these and only these.
  actual:
    mon: ["08:00", "21:00"]
    tue: ["08:00", "21:00"]
    wed: ["08:00", "21:00"]
    thu: ["08:00", "22:00"]
    fri: ["08:00", "22:00"]
    sat: ["08:00", "22:00"]
    sun: ["10:00", "21:00"]
  # The legal ceiling. Never advertised, never published as opening hours.
  licensed:
    mon: ["05:00", "24:00"]
    tue: ["05:00", "24:00"]
    wed: ["05:00", "24:00"]
    thu: ["05:00", "24:00"]
    fri: ["05:00", "24:00"]
    sat: ["05:00", "24:00"]
    sun: ["10:00", "22:00"]
  # Liquor sales cannot start before this time on a Sunday, whatever the door says.
  sunday_sales_start: "10:00"
  timezone: "Australia/Sydney"

services:
  delivery:
    - name: "Uber Eats"
      url: null
  click_and_collect: false          # do not generate copy implying it exists
  parking: "Free parking on site"
  payments: ["EFTPOS", "Visa", "Mastercard", "Amex", "Cash"]

catchment:
  primary_suburbs:
    - "Marsfield"
    - "Macquarie Park"
    - "North Ryde"
    - "Denistone"
    - "Eastwood"
    - "Epping"
    - "Ryde"
    - "East Ryde"
  demand_drivers:
    - "Macquarie University students and staff"
    - "Macquarie Park office workers"
    - "local families"
    - "walk-up convenience trade"
    - "weekend top-ups"

# How far apart geo.lat/lng and geo.plus_code may sit before the config is
# rejected. One plus-code cell is ~14 m; 100 m allows for a pin dropped at the
# door versus one at the centre of the tenancy, and still catches a real error.
geo_plus_code_tolerance_m: 100

compliance:
  # Verbatim, mandated wording. compliance_check() requires this string on every
  # piece of alcohol-promoting copy.
  responsible_service_line: >-
    It is against the law to sell or supply alcohol to, or to obtain alcohol on
    behalf of, a person under the age of 18 years.
  # Surfaces that must carry the licence footer on alcohol copy. GBP Q&A answers
  # are deliberately excluded - a footer reads as spam in an answer - but they are
  # still checked against every other rule. Add "qanda" here to tighten that.
  footer_surfaces: ["post", "product", "photo_caption"]
  # {licensee} / {licence_number} / {rsa_line} are substituted by compliance.footer().
  footer_template: |-
    {rsa_line}
    {licensee} | Licence No. {licence_number}
  # Vague or open-ended trading claims. Rejected regardless of the real hours.
  forbidden_hours_phrases:
    - "open 24 hours"
    - "24/7"
    - "always open"
    - "open till late"
    - "open til late"
    - "open until late"
    - "open all night"
