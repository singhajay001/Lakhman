<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<title>SPIRITHAUS — A4 Landscape Box Artwork</title>
<link rel="stylesheet" href="fonts.css">
<style>
:root{--ink:#111110;--bone:#F2EFE9;--red:#CF1C29;--page-w:297mm;--page-h:210mm;--pad:20mm}
*{box-sizing:border-box;margin:0;padding:0}
@page{size:297mm 210mm;margin:0}
html,body{background:#777}
body{font-family:'Archivo',Helvetica,Arial,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}

.sheet{
  position:relative;width:var(--page-w);height:var(--page-h);margin:0 auto;
  background:var(--ink);color:var(--bone);overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.v-bone .sheet{background:var(--bone);color:var(--ink)}

/* oversized U, cropped off the right edge -- quiet texture, not decoration */
.ghost{
  /* bleeds off the top and right edges so only the bowl sweep reads --
     the stems must run off-canvas, or their flat tops look like an artifact */
  position:absolute;right:-72mm;top:-34mm;
  width:196mm;height:199mm;color:var(--bone);opacity:.055;pointer-events:none;
}
.v-bone .ghost{color:var(--ink);opacity:.05}
.ghost svg{display:block;width:100%;height:100%}

.lockup{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:7mm}
.wordmark{display:flex;align-items:baseline;line-height:.8;white-space:nowrap;font-size:22mm}
.wm-a{font-weight:300;letter-spacing:.20em}
.wm-b{font-weight:800;letter-spacing:-.005em;display:inline-flex;align-items:baseline}
.wm-u{display:inline-block;height:.72em;width:.71em;margin:0 .012em}
.wm-u svg{display:block;height:100%;width:100%}
.tagline{
  font-family:'Space Mono',monospace;font-size:3.4mm;letter-spacing:.52em;
  text-transform:uppercase;color:rgba(242,239,233,.62);text-indent:.52em;
}
.v-bone .tagline{color:rgba(17,17,16,.6)}

.rule{position:relative;z-index:2;width:18mm;height:.9mm;background:var(--red);margin:13mm 0 0}

.origin{
  position:absolute;left:0;right:0;bottom:var(--pad);z-index:2;text-align:center;
  font-family:'Space Mono',monospace;font-size:2.8mm;letter-spacing:.42em;
  text-transform:uppercase;color:rgba(242,239,233,.45);text-indent:.42em;
}
.v-bone .origin{color:rgba(17,17,16,.45)}

.corner{
  position:absolute;top:var(--pad);left:var(--pad);z-index:2;
  font-family:'Space Mono',monospace;font-size:2.6mm;letter-spacing:.3em;
  text-transform:uppercase;color:rgba(242,239,233,.42);
}
.v-bone .corner{color:rgba(17,17,16,.42)}
.corner.r{left:auto;right:var(--pad);text-align:right}

/* bleed build: 216 x 303mm, trim 210 x 297 centred */
.v-bleed .sheet{width:303mm;height:216mm}
</style>
</head>
<body>
<div class="sheet">
  <div class="ghost"><svg viewBox="0 0 276 280" xmlns="http://www.w3.org/2000/svg"><path fill="currentColor" d="M0,0 L0,142 A138,138 0 0,0 276,142 L276,0 L216,0 L216,142 A78,78 0 0,1 60,142 L60,0 Z"/></svg></div>

  <div class="corner">Specialist spirits</div>
  <div class="corner r">Est. Sydney</div>

  <div class="lockup">
    <div class="wordmark">
      <span class="wm-a">SPIRIT</span><span class="wm-b">HA<span class="wm-u"><svg viewBox="0 0 276 280" xmlns="http://www.w3.org/2000/svg"><defs><clipPath id="b2"><path d="M60,0 L60,142 A78,78 0 0,0 216,142 L216,0 Z"/></clipPath></defs><path fill="currentColor" d="M0,0 L0,142 A138,138 0 0,0 276,142 L276,0 L216,0 L216,142 A78,78 0 0,1 60,142 L60,0 Z"/><rect clip-path="url(#b2)" x="60" y="162" width="156" height="118" fill="#CF1C29"/></svg></span>S</span>
    </div>
    <div class="tagline">Spirits · Wine · Cocktails</div>
    <div class="rule"></div>
  </div>

  <div class="origin">Sydney · Australia</div>
</div>
<script>
(function(){
  var v=new URLSearchParams(location.search).get('v')||'ink', r=document.documentElement;
  if(/bone/.test(v)) r.classList.add('v-bone');
  if(/bleed/.test(v)){
    r.classList.add('v-bleed');
    var s=document.createElement('style');
    s.textContent='@page{size:303mm 216mm;margin:0}';
    document.head.appendChild(s);
  }
})();
</script>
</body>
</html>
